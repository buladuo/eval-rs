# Faithfulness 第二步：验证单个声明是否能从上下文中推断

name = "faithfulness_verify_claim"
version = "1.0"
description = "判断单个声明是否可以从检索到的上下文中推断出来"

template = """
## 检索到的上下文
{{ context }}

## 待验证的声明
{{ claim }}

请判断上述声明是否可以从检索到的上下文中**推断**出来。
- 若声明中的所有信息都在上下文中能找到依据，返回答 `verdict=1`
- 若声明包含上下文中不存在的信息（幻觉），返回答 `verdict=0`

请以 JSON 格式返回：
```json
{"reason": "简要说明判断依据", "verdict": 1}
```

仅返回 JSON，不要其他内容。
"""

[variables.context]
type = "string"
description = "检索到的上下文"
required = true

[variables.claim]
type = "string"
description = "待验证的声明"
required = true
