# Faithfulness 第一步：从回答中分解出独立声明（claims）

name = "faithfulness_extract_claims"
version = "1.0"
description = "将模型回答分解为一组可独立验证的事实声明"

template = """
请将以下回答分解为一组独立的、可验证的事实声明（claims）。

## 回答
{{ answer }}

## 要求
- 每个声明应是一个完整、独立、可验证的句子
- 将回答中的每个事实点分解为单独的声明
- 不要添加、修改或遗漏回答中的任何信息

请以 JSON 格式返回声明列表：
```json
{"claims": ["声明1", "声明2", "声明3"]}
```

仅返回 JSON，不要其他内容。
"""

[variables.answer]
type = "string"
description = "待分解的模型回答"
required = true
