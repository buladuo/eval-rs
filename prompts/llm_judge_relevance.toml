# LLM-as-Judge 相关性评估提示词
# 评估模型回答与问题的相关性

name = "llm_judge_relevance"
version = "1.0"
description = "评估模型回答与问题的相关性，返回 0-1 之间的评分"

template = """
你是一位专业的评估专家，请评估模型回答与问题的相关性。

## 问题
{{ question }}

## 模型回答
{{ answer }}

## 评估要求
请评估模型回答与问题的相关性：
1. 是否直接回答了问题
2. 是否切题，没有跑题
3. 是否提供了有用的信息

请以 JSON 格式返回评估结果，格式如下：
```json
{"score": 0.85, "reason": "简要说明评分依据"}
```
其中 score 为 0 到 1 之间的浮点数（保留 2 位小数），1 表示完全相关，0 表示完全不相关。
仅返回 JSON，不要其他内容。
"""

[variables.question]
type = "string"
description = "问题"
required = true

[variables.answer]
type = "string"
description = "模型回答"
required = true
