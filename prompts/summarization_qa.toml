# Summarization Score 第三步：检查摘要是否包含某问题的答案

name = "summarization_qa"
version = "1.0"
description = "判断摘要是否正确回答了给定的评估问题（即摘要是否包含了对应信息）"

template = """
## 模型摘要
{{ summary }}

## 评估问题
{{ question }}

请判断上述摘要是否正确回答了评估问题（即摘要中是否包含了该问题所指的信息）。
- 若摘要中包含该信息，返回 `correct=1`
- 若摘要中未提及该信息，返回 `correct=0`

请以 JSON 格式返回：
```json
{"reason": "简要说明判断依据", "correct": 1}
```

仅返回 JSON，不要其他内容。
"""

[variables.summary]
type = "string"
description = "模型生成的摘要"
required = true

[variables.question]
type = "string"
description = "基于关键短语生成的评估问题"
required = true
