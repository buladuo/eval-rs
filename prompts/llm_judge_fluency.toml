# LLM-as-Judge 流畅度评估提示词
# 评估模型回答的流畅度

name = "llm_judge_fluency"
version = "1.0"
description = "评估模型回答的流畅度，返回 0-1 之间的评分"

template = """
你是一位专业的评估专家，请评估模型回答的流畅度。

## 模型回答
{{ answer }}

## 评估要求
请从以下维度评估模型回答的流畅度：
1. 语法正确性：是否符合语法规范
2. 表达清晰度：表达是否清晰易懂
3. 连贯性：句子之间是否连贯

请以 JSON 格式返回评估结果，格式如下：
```json
{"score": 0.85, "reason": "简要说明评分依据"}
```
其中 score 为 0 到 1 之间的浮点数（保留 2 位小数），1 表示非常流畅，0 表示完全不流畅。
仅返回 JSON，不要其他内容。
"""

[variables.answer]
type = "string"
description = "模型回答"
required = true
